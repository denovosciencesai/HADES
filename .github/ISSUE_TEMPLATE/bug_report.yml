name: Bug report
description: Something in HADES does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (for example a model file that gets past the checksum
        check) should not be reported here. Follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The smallest command or code that shows the problem, including the
        SMILES involved if it is about scoring.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: The full traceback or the output you got.
      render: text
  - type: input
    id: version
    attributes:
      label: HADES version or commit
      placeholder: "1.0.0, or the output of git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11, ..."
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Key package versions
      description: Output of `conda list "python|rdkit|pandas|scikit-learn|mordred|admet"`
      render: text
  - type: dropdown
    id: verify
    attributes:
      label: Do the model checksums verify?
      description: >-
        Run `python HADES_CALCULATOR.py --verify require -i data_to_test.csv -o out.csv`
        from the repository root.
      options:
        - "Yes, it verifies"
        - "No, it fails verification"
        - "Not using the shipped models"
    validations:
      required: true
