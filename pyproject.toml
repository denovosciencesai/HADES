[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name; `hades` is taken there. Imports are unchanged:
# `import HADES`, `from HADES_CALCULATOR import HADES_score`.
name = "hades-druglikeness"
version = "1.0.0"
description = "Machine-learning oral drug-likeness score for small molecules from their SMILES"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The paper's authors, as in CITATION.cff.
authors = [
    { name = "Narek Petrosyan" },
    { name = "Hovhannes Matevosyan" },
    { name = "Irina Tirosyan" },
    { name = "Yeva Gabrielyan" },
    { name = "Smbat Gevorgyan" },
    { name = "Vardan Harutyunyan" },
    { name = "Mher Matevosyan" },
    { name = "Hovakim Zakaryan" },
]
# The pickled models and the pinned stack were built on Python 3.10 (see
# environment.yml); nothing here has been validated on 3.11+.
requires-python = ">=3.10,<3.11"
dynamic = ["dependencies"]
keywords = [
    "drug-likeness", "oral drug-likeness", "cheminformatics", "drug discovery",
    "medicinal chemistry", "virtual screening", "ADMET", "QED", "SMILES", "RDKit",
    "Mordred", "machine learning", "ensemble learning", "MCP", "Claude Code",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/denovosciencesai/HADES"
Documentation = "https://github.com/denovosciencesai/HADES#readme"
Issues = "https://github.com/denovosciencesai/HADES/issues"
Paper = "https://doi.org/10.1021/acs.jcim.5c02953"

[project.optional-dependencies]
# What CI and CONTRIBUTING.md install to run the checks. Pinned like everything
# else: an unpinned ruff turns the build red on its own release schedule, with
# no change to this repository.
dev = ["pytest==9.1.1", "ruff==0.17.1"]
# The MCP server, hades_mcp.py, for Claude Code, Claude Desktop and other MCP
# clients. Scoring and training do not need it. README.md and docs/mcp.md give
# the same pin for a bare `pip install`; change them together.
mcp = ["mcp==2.3.0"]

[project.scripts]
hades-score = "HADES_CALCULATOR:main"
hades-train = "train_your_HADES:main"
hades-mcp = "hades_mcp:main"

[tool.setuptools]
# Flat layout: the package sits at the repo root under its own name, and the
# entry-point scripts stay beside it as top-level modules so the published
# `from HADES_CALCULATOR import HADES_score` keeps working once installed.
packages = ["HADES"]
py-modules = ["HADES_CALCULATOR", "train_your_HADES", "hades_mcp"]

[tool.setuptools.package-data]
# The trained ensemble and the descriptor spec travel inside the package, so an
# installed copy scores without a repository checkout. Shipping data is opt-in:
# drop these patterns and `pip install` quietly produces a HADES that cannot
# find its own models.
HADES = ["data/models/*.pkl", "data/models/SHA256SUMS", "data/feature_spec.parquet"]

[tool.setuptools.dynamic]
# Single source of truth for pins -- a second list here would drift from the
# one environment.yml installs. rdkit is listed too, so a pip-only install
# works; in the conda environment, conda-forge installs the same version first
# and pip counts it as already satisfied.
dependencies = {file = ["requirements.txt"]}

[tool.ruff.lint]
# Deliberately narrow. W191/E101 catch a tab reintroduced into a package that
# was normalised to spaces; F (pyflakes) catches real mistakes -- a name
# imported and never used, a name used and never imported. Everything ruff
# reports beyond this is formatting opinion, and N999 ("invalid module name:
# 'HADES'") could only be satisfied by renaming the package.
select = ["W191", "E101", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Training takes ~16 minutes; run those tests explicitly with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: trains a model end to end (~16 minutes)"]
