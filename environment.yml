# Reproducible environment for the HADES project.
#
# Recreate on any machine with:
#     conda env create -f environment.yml
#     conda activate hades
#
# RDKit is installed through conda-forge because its compiled components install
# far more reliably that way than through pip. Everything else is pinned in
# requirements.txt and installed with pip.

name: hades-clean
channels:
  - conda-forge
dependencies:
  - python=3.10.*           # patch level floats on purpose; 3.11+ is untested
  - rdkit=2025.9.6          # if conda-forge reports a different build string,
                            # run:  conda search -c conda-forge rdkit
  - libstdcxx-ng>=13        # rdkit 2025.9 needs GLIBCXX_3.4.31 (GCC 13);
  - libgcc-ng>=13           # Ubuntu 22.04 ships only 3.4.30 -> ImportError
  - pip=26.*
  - setuptools<82           # hyperopt (via admet_ai -> chemprop 1.6.1) imports
                            # pkg_resources, dropped in setuptools 82.
                            # chemprop 1.6.1 declares no setuptools constraint,
                            # so nothing else enforces this.
  - pip:
      - -r requirements.txt
