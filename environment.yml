# The contributor and reproduction environment: what CI builds, what
# CONTRIBUTING.md sets up, and what training wants. Scoring does not need it --
# the models ship inside the package, so `pip install hades-druglikeness` (or
# `uvx` for the MCP server) is enough for users. See README.md > Installation.
name: hades
channels:
  - conda-forge
dependencies:
  - python=3.10.*
  - rdkit=2025.9.6
  - pip=26.*
  - setuptools<82           # hyperopt (via admet_ai -> chemprop 1.6.1) imports
                            # pkg_resources, dropped in setuptools 82.
                            # chemprop 1.6.1 declares no setuptools constraint,
                            # so nothing else enforces this.
  - pip:
      # The CPU-only torch build. On Linux, PyPI's torch bundles several GB of
      # CUDA libraries that HADES never uses; this index has the same version
      # without them (2.5.1+cpu), and it scores the paper's 1,622 test-set
      # molecules bit-for-bit like the CUDA build. On Windows PyPI's torch is
      # already CPU-only; macOS has no build here and falls back to PyPI's.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - -r requirements.txt
