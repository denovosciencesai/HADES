name: hades
channels:
  - conda-forge
dependencies:
  - python=3.10.*
  - rdkit=2025.9.6
  - pip=26.*
  - setuptools<82           # hyperopt (via admet_ai -> chemprop 1.6.1) imports
                            # pkg_resources, dropped in setuptools 82.
                            # chemprop 1.6.1 declares no setuptools constraint,
                            # so nothing else enforces this.
  - pip:
      - -r requirements.txt
